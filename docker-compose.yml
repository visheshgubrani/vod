services:
  postgres:
    image: postgres:18-alpine
    container_name: vod-postgres-dev
    restart: unless-stopped
    ports:
      - "5433:5432" # Host mapping for `wrangler dev` / local tooling
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vod_dev
    volumes:
      # postgres:18 moved its cluster to $PGDATA=/var/lib/postgresql/18/docker and
      # declares the volume at /var/lib/postgresql — mounting the named volume at
      # the pre-18 /var/lib/postgresql/data path leaves it empty and puts the real
      # data in an anonymous volume that is discarded on every recreate.
      - vod_postgres_dev_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: vod-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8787:4080"
    env_file:
      - path: ./server/.dev.vars
        required: false
    environment:
      # Container networking: the API talks to compose Postgres directly.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/vod_dev}
      DB_DRIVER: pg
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8787}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8787}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-0123456789abcdef}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-better-auth-secret-change-me-0123456}
      NODE_ENV: production

  # Background maintenance for the Docker runtime.
  #
  # The Workers deployment gets this from the cron trigger in
  # server/wrangler.jsonc; a container has no equivalent, and without something
  # calling the endpoint the system silently stops reconciling: webhook retries
  # never run, and deleted videos keep their bytes forever. This service is that
  # something.
  #
  # It calls the same `runMaintenance` path the cron does, so both runtimes do
  # identical work. Requires INTERNAL_SWEEP_SECRET (set it in server/.dev.vars).
  maintenance:
    image: alpine:3.20
    container_name: vod-maintenance
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    env_file:
      - path: ./server/.dev.vars
        required: false
    environment:
      # Deliberately NOT setting INTERNAL_SWEEP_SECRET here. Compose gives
      # `environment` precedence over `env_file`, so an entry like
      # ${INTERNAL_SWEEP_SECRET:-} would substitute an empty string whenever the
      # secret lives only in server/.dev.vars (the documented location) — and
      # blank the value env_file had just provided, putting this service into
      # its "refusing to start" branch.
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-900}
    command: >
      sh -c '
        if [ -z "$$INTERNAL_SWEEP_SECRET" ]; then
          echo "[maintenance] INTERNAL_SWEEP_SECRET is not set; refusing to start."
          echo "[maintenance] Webhook retries and storage reclamation will NOT run."
          sleep infinity;
        fi;
        echo "[maintenance] running every $${MAINTENANCE_INTERVAL_SECONDS}s";
        while true; do
          sleep "$$MAINTENANCE_INTERVAL_SECONDS";
          wget -q -O- --header="x-sweep-secret: $$INTERNAL_SWEEP_SECRET" \
            --post-data="" http://api:4080/api/internal/sweep \
            || echo "[maintenance] pass failed; will retry";
        done'

  # The self-hosted transcoding agent.
  #
  # Opt-in: `docker compose --profile transcoder up -d`. It is a profile rather
  # than a default service because a machine running the API is often not the
  # machine that should be doing the encoding, and because a local-only install
  # needs this while an all-Cloudflare install does not.
  #
  # The media mounts are read-only on purpose. The agent takes its own snapshot
  # to encode from; it never needs to write to the owner's library, and a
  # container that cannot write to it cannot damage it.
  transcoder:
    profiles: ["transcoder"]
    build:
      context: .
      dockerfile: transcoding/Dockerfile.agent
    container_name: vod-transcoder
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      OPENVOD_API_URL: ${OPENVOD_API_URL:-http://api:4080}
      OPENVOD_AGENT_TOKEN: ${OPENVOD_AGENT_TOKEN:-}
      # NAME:PATH pairs. Every path here must also be mounted below.
      OPENVOD_ROOTS: ${OPENVOD_ROOTS:-media:/media}
      OPENVOD_SCRATCH_DIR: /var/lib/openvod-transcoder/scratch
      # One job and one rendition at a time by default: this machine is likely
      # someone's workstation, and an operator who wants more says so.
      OPENVOD_CAPACITY_JOBS: ${OPENVOD_CAPACITY_JOBS:-1}
      OPENVOD_CAPACITY_RENDITIONS: ${OPENVOD_CAPACITY_RENDITIONS:-1}
      OPENVOD_ENCODER: ${OPENVOD_ENCODER:-auto}
    volumes:
      - transcoder_scratch:/var/lib/openvod-transcoder
      - ${OPENVOD_MEDIA_DIR:-./media}:/media:ro
    # NVIDIA hosts: uncomment, and note the `video` capability — without it the
    # driver is visible but no encode session can be created.
    #   deploy:
    #     resources:
    #       reservations:
    #         devices:
    #           - driver: nvidia
    #             count: all
    #             capabilities: [gpu, video]
    # AMD hosts: uncomment the device and group.
    # devices:
    #   - /dev/dri/renderD128:/dev/dri/renderD128
    # group_add:
    #   - video

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8787/api
        NEXT_PUBLIC_AUTH_BASE_URL: http://localhost:8787/api/auth
        NEXT_PUBLIC_FRONTEND_URL: http://localhost:3000
    container_name: vod-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  vod_postgres_dev_data:
  transcoder_scratch:
