services:
  postgres:
    image: postgres:18-alpine
    container_name: vod-postgres-dev
    restart: unless-stopped
    ports:
      - "5433:5432" # 5432 is taken by vm-postgres-1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vod_dev
    volumes:
      - vod_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vod_postgres_dev_data:
