services:
  # Backend API Server
  server:
    image: ghcr.io/visheshgubrani/vod/server:${TAG:-latest}
    container_name: vod_server
    restart: unless-stopped
    ports:
      - "4080:4080"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Next.js Frontend
  web:
    image: ghcr.io/visheshgubrani/vod/web:${TAG:-latest}
    container_name: vod_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      server:
        condition: service_healthy
