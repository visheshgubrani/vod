services:
  postgres:
    image: postgres:18-alpine
    container_name: vod-postgres-dev
    restart: unless-stopped
    ports:
      - "5433:5432" # Host mapping for `wrangler dev` / local tooling
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vod_dev
    volumes:
      - vod_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: vod-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8787:4080"
    env_file:
      - path: ./server/.dev.vars
        required: false
    environment:
      # Container networking: the API talks to compose Postgres directly.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/vod_dev}
      DB_DRIVER: pg
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8787}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8787}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-0123456789abcdef}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-better-auth-secret-change-me-0123456}
      NODE_ENV: production

  # Background maintenance for the Docker runtime.
  #
  # The Workers deployment gets this from the cron trigger in
  # server/wrangler.jsonc; a container has no equivalent, and without something
  # calling the endpoint the system silently stops reconciling: webhook retries
  # never run, and deleted videos keep their bytes forever. This service is that
  # something.
  #
  # It calls the same `runMaintenance` path the cron does, so both runtimes do
  # identical work. Requires INTERNAL_SWEEP_SECRET (set it in server/.dev.vars).
  maintenance:
    image: alpine:3.20
    container_name: vod-maintenance
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    env_file:
      - path: ./server/.dev.vars
        required: false
    environment:
      INTERNAL_SWEEP_SECRET: ${INTERNAL_SWEEP_SECRET:-}
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-900}
    command: >
      sh -c '
        if [ -z "$$INTERNAL_SWEEP_SECRET" ]; then
          echo "[maintenance] INTERNAL_SWEEP_SECRET is not set; refusing to start."
          echo "[maintenance] Webhook retries and storage reclamation will NOT run."
          sleep infinity;
        fi;
        echo "[maintenance] running every $${MAINTENANCE_INTERVAL_SECONDS}s";
        while true; do
          sleep "$$MAINTENANCE_INTERVAL_SECONDS";
          wget -q -O- --header="x-sweep-secret: $$INTERNAL_SWEEP_SECRET" \
            --post-data="" http://api:4080/api/internal/sweep \
            || echo "[maintenance] pass failed; will retry";
        done'

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8787/api
        NEXT_PUBLIC_AUTH_BASE_URL: http://localhost:8787/api/auth
        NEXT_PUBLIC_FRONTEND_URL: http://localhost:3000
    container_name: vod-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  vod_postgres_dev_data:
