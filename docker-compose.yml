# ClipMux — DEPLOYMENT stack (end users, and how we test a deployment).
#
#   cp .env.example .env    # then edit it: secrets, domains, bucket names
#   docker compose run --rm migrate
#   docker compose up -d
#
# This file is NOT the development loop. Local development runs the API and the
# dashboard on the host (`pnpm dev`) against the containers in
# docker-compose.dev.yml — Postgres + Redis only. Nothing here should be
# required to develop ClipMux, and nothing here reads server/.dev.vars.
#
# Configuration comes from `.env` at the repo root, which Compose reads twice:
#   * for `${...}` interpolation in this file (Compose only reads the shell env
#     and `.env` for interpolation — an `env_file:` value cannot interpolate)
#   * as the container environment for `api` and `maintenance`
# So one file configures both the stack's wiring and the API's env.
#
# Delivery is deliberately absent: signed playback is always the Cloudflare
# Worker in delivery/ plus R2. There is no Node delivery, so there is no service
# for it here. See docs/deployment-shapes.md.

name: clipmux

services:
  postgres:
    image: postgres:18-alpine
    container_name: clipmux-postgres
    restart: unless-stopped
    # Deliberately not published on the host: only the api container needs it,
    # and an unpublished port cannot collide with the dev Postgres on 5433 or
    # expose the database to the network.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-clipmux}
    volumes:
      # postgres:18 moved its cluster to $PGDATA=/var/lib/postgresql/18/docker and
      # declares the volume at /var/lib/postgresql — mounting the pre-18
      # /var/lib/postgresql/data path leaves it empty and puts the real data in an
      # anonymous volume that is discarded on every recreate.
      - clipmux_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # Rate limiting. `memory` also works, but only per instance: with more than
    # one API replica the limits are per replica unless they share a store.
    # Point REDIS_URL elsewhere to use an external Redis.
    image: redis:7-alpine
    container_name: clipmux-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot migration. The api container also migrates on boot (zero-touch), but
  # that runs once per replica and races if you scale out — run this instead when
  # you deploy. Idempotent, so running it always is safe.
  migrate:
    profiles: ["tools"]
    image: ${CLIPMUX_API_IMAGE:-clipmux-api:local}
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-clipmux}}
      DB_DRIVER: ${DB_DRIVER:-pg}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node_modules/.bin/tsx", "src/node/migrate.ts"]

  api:
    image: ${CLIPMUX_API_IMAGE:-clipmux-api:local}
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: clipmux-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # localhost by default: put a reverse proxy (or a tunnel) in front for
      # public traffic rather than exposing the API directly. Override with
      # CLIPMUX_API_PORT, and note this port is also what `pnpm dev` uses —
      # run the dev stack or this one, not both.
      - "127.0.0.1:${CLIPMUX_API_PORT:-8787}:4080"
    env_file:
      - .env
    environment:
      # Container networking: service DNS, and an external DATABASE_URL/REDIS_URL
      # from .env still wins because the default is itself an interpolation.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-clipmux}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DB_DRIVER: ${DB_DRIVER:-pg}
      NODE_ENV: production

  # Background maintenance for every non-Workers runtime.
  #
  # The Workers deployment gets this from the cron trigger in
  # server/wrangler.jsonc; a container has no equivalent, and without something
  # calling the endpoint the system silently stops reconciling: webhook retries
  # never run, and deleted videos keep their bytes forever. This service is that
  # something.
  #
  # It calls the same `runMaintenance` path the cron does, so both runtimes do
  # identical work. Requires INTERNAL_SWEEP_SECRET in .env.
  maintenance:
    image: alpine:3.20
    container_name: clipmux-maintenance
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    env_file:
      - .env
    environment:
      # Deliberately NOT setting INTERNAL_SWEEP_SECRET here. Compose gives
      # `environment` precedence over `env_file`, so an entry like
      # ${INTERNAL_SWEEP_SECRET:-} would substitute an empty string whenever the
      # secret is absent from `.env`, blanking the value env_file had just
      # provided and putting this service into its "refusing to start" branch.
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-900}
    command: >
      sh -c '
        if [ -z "$$INTERNAL_SWEEP_SECRET" ]; then
          echo "[maintenance] INTERNAL_SWEEP_SECRET is not set; refusing to start.";
          echo "[maintenance] Webhook retries and storage reclamation will NOT run.";
          sleep infinity;
        fi;
        echo "[maintenance] running every $${MAINTENANCE_INTERVAL_SECONDS}s";
        while true; do
          sleep "$${MAINTENANCE_INTERVAL_SECONDS}";
          wget -q -O- --header="x-sweep-secret: $$INTERNAL_SWEEP_SECRET" \
            --post-data="" http://api:4080/api/internal/sweep \
            || echo "[maintenance] pass failed; will retry";
        done'

  web:
    image: ${CLIPMUX_WEB_IMAGE:-clipmux-web:local}
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # Baked into the client bundle at build time. Point these at the public
        # origins users will actually reach — rebuilding is the only way to
        # change them (Next.js inlines NEXT_PUBLIC_*).
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8787/api}
        NEXT_PUBLIC_AUTH_BASE_URL: ${NEXT_PUBLIC_AUTH_BASE_URL:-http://localhost:8787/api/auth}
        NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL:-http://localhost:3000}
    container_name: clipmux-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:${CLIPMUX_WEB_PORT:-3000}:3000"

  # The self-hosted transcoding agent (`TRANSCODE_PROVIDER=self-hosted`).
  #
  # Opt-in: `docker compose --profile transcoder up -d`. It is a profile rather
  # than a default service because a machine running the API is often not the
  # machine that should be doing the encoding, and because an all-Cloudflare
  # install does not need it at all.
  #
  # The media mounts are read-only on purpose. The agent takes its own snapshot
  # to encode from; it never needs to write to the owner's library, and a
  # container that cannot write to it cannot damage it.
  transcoder:
    profiles: ["transcoder"]
    image: ${CLIPMUX_AGENT_IMAGE:-clipmux-transcoder:local}
    build:
      context: .
      dockerfile: transcoding/Dockerfile.agent
    container_name: clipmux-transcoder
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      CLIPMUX_API_URL: ${CLIPMUX_API_URL:-http://api:4080}
      CLIPMUX_AGENT_TOKEN: ${CLIPMUX_AGENT_TOKEN:-}
      # NAME:PATH pairs. Every path here must also be mounted below.
      CLIPMUX_ROOTS: ${CLIPMUX_ROOTS:-media:/media}
      CLIPMUX_SCRATCH_DIR: /var/lib/clipmux-transcoder/scratch
      # One job and one rendition at a time by default: this machine is likely
      # someone's workstation, and an operator who wants more says so.
      CLIPMUX_CAPACITY_JOBS: ${CLIPMUX_CAPACITY_JOBS:-1}
      CLIPMUX_CAPACITY_RENDITIONS: ${CLIPMUX_CAPACITY_RENDITIONS:-1}
      CLIPMUX_ENCODER: ${CLIPMUX_ENCODER:-auto}
    volumes:
      - clipmux_transcoder_scratch:/var/lib/clipmux-transcoder
      - ${CLIPMUX_MEDIA_DIR:-./media}:/media:ro
    # The agent polls the API, so CLIPMUX_API_URL has to resolve *from inside the
    # container*: the service name only works when the bundled api service is the
    # API. For a Workers API use its public URL; for `pnpm dev` on this machine
    # use http://host.docker.internal:<port> — which is why this mapping exists
    # (Docker Desktop provides it, plain Linux Docker does not).
    extra_hosts:
      - host.docker.internal:host-gateway
    # NVIDIA hosts: uncomment, and note the `video` capability — without it the
    # driver is visible but no encode session can be created.
    #   deploy:
    #     resources:
    #       reservations:
    #         devices:
    #           - driver: nvidia
    #             count: all
    #             capabilities: [gpu, video]
    # AMD hosts: uncomment the device and group.
    # devices:
    #   - /dev/dri/renderD128:/dev/dri/renderD128
    # group_add:
    #   - video

volumes:
  clipmux_postgres:
  clipmux_transcoder_scratch:
