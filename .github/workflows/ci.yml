name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PNPM_VERSION: 10.12.4

jobs:
  js-workspace:
    name: ${{ matrix.command }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command: [test, typecheck, 'typecheck:tsc']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.command }}
        run: pnpm ${{ matrix.command }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter ./web lint
      - name: Build (standalone)
        run: pnpm --filter ./web build

  transcoding-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run pytest
        working-directory: transcoding
        run: python -m pytest tests

  branding-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid residual brand strings in source
        run: |
          if grep -rInE 'clipmux|indiemux' --include='*.ts' --include='*.tsx' --include='*.py' \
             server delivery web sdk player transcoding docs README.md CONTRIBUTING.md; then
            echo "Residual brand strings found (see above). Rename pass incomplete."
            exit 1
          fi
