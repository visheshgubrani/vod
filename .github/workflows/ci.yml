name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PNPM_VERSION: 12.3.4

jobs:
  js-workspace:
    name: ${{ matrix.command }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command: [test, typecheck, 'typecheck:tsc']
    # Integration tests assert atomicity, leases and locking. A fake executor
    # cannot establish those — they live in Postgres, not in our code. The
    # suite reads TEST_DATABASE_URL and skips cleanly when it is unset, so
    # `pnpm test` still works on a machine with no database.
    #
    # Redis is here for the same reason: the plain-Redis rate-limit adapter
    # evaluates a Lua script, and only a real server proves it runs at all.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clipmux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clipmux_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.command }}
        run: pnpm ${{ matrix.command }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      # The dashboard consumes @clipmux/player and @clipmux/uploader as
      # workspace packages, so their built output must exist before Next builds.
      - name: Build SDK packages
        run: |
          pnpm --filter @clipmux/uploader build
          pnpm --filter @clipmux/player build
          pnpm --filter @clipmux/server build
      - name: Lint
        run: pnpm --filter ./web lint
      - name: Build (standalone)
        run: pnpm --filter ./web build

  marketing:
    runs-on: ubuntu-latest
    # Production builds intentionally reject missing marketing destinations.
    # CI supplies syntactically valid test destinations; deployments provide the
    # real docs and hosted-form URLs through marketing/.env.example.
    env:
      MARKETING_CANONICAL_ORIGIN: https://clipmux.com
      MARKETING_DOCS_URL: https://docs.clipmux.com
      MARKETING_QUICKSTART_URL: https://docs.clipmux.com/quickstart
      MARKETING_GITHUB_URL: https://github.com/visheshgubrani/vod
      MARKETING_MANAGED_FORM_URL: https://forms.example.invalid/clipmux-managed
      MARKETING_ENTERPRISE_FORM_URL: https://forms.example.invalid/clipmux-enterprise
      MARKETING_PRIVACY_URL: https://clipmux.com/privacy
      MARKETING_HERO_VIDEO_URL: /media/hero-1080.mp4
      MARKETING_HERO_VIDEO_MOBILE_URL: /media/hero-720.mp4
      MARKETING_HERO_POSTER_URL: /media/hero-poster.jpg
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter clipmux-marketing typecheck
      - name: Lint
        run: pnpm --filter clipmux-marketing lint
      - name: Build marketing site
        run: pnpm --filter clipmux-marketing build

  # The integration example *is* the documented developer experience, compiled
  # on every change. Docs rot silently; a broken build does not.
  e2e:
    name: browser coverage
    runs-on: ubuntu-latest
    # The marketing and web specs run against the dev servers the Playwright
    # config starts itself; the authenticated dashboard specs skip unless
    # E2E_STORAGE_STATE is provided, which CI deliberately does not do.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Typecheck the specs
        run: pnpm exec tsc --noEmit -p e2e/tsconfig.json
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser coverage
        # The web app validates its env at build time; the dev server it boots
        # here only needs the public API base URL to render its shell.
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8787/api
          NEXT_PUBLIC_AUTH_BASE_URL: http://localhost:8787
          NEXT_PUBLIC_FRONTEND_URL: http://localhost:3000
        run: pnpm test:e2e

  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Build SDK packages
        run: |
          pnpm --filter @clipmux/uploader build
          pnpm --filter @clipmux/player build
          pnpm --filter @clipmux/server build
      - name: Build the example
        run: pnpm --filter ./examples/nextjs-integration build

  # The docs site is the developer-facing product, and it was the only package
  # with no CI job at all: a broken MDX page or a dead component shipped
  # silently. `typecheck` is covered by the js-workspace matrix, which runs
  # `pnpm -r --if-present typecheck` and now matches docs-site's script.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Build the docs site
        run: pnpm --filter clipmux-docs build

  transcoding-python:
    runs-on: ubuntu-latest
    # 3.12, the version both managed images run (transcoding/toolchain/versions.env
    # PYTHON_VERSION), so the suite cannot pass here on an interpreter the
    # images do not have.
    env:
      # The real-media suites skip when a binary is missing, which is right on a
      # laptop and wrong here: in CI a missing ffmpeg/ffprobe/packager has to be
      # a red build, not a green one with three skipped tests. This turns the
      # skip into a failure. (The test module reads it; see
      # transcoding/tests/test_real_media.py.)
      CLIPMUX_REQUIRE_MEDIA_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The suites import `config`, which imports botocore/boto3, and network
      # tests import requests. Installing only pytest made this job fail at
      # collection (4 of 5 files errored) rather than run.
      - name: Install test dependencies
        run: python -m pip install pytest botocore boto3 requests
      # ffmpeg from apt is enough for CI: the real-media suites exercise the
      # engine's argument builders and the packaging flow, not NVIDIA's scaling
      # path. The managed image builds its own FFmpeg
      # (transcoding/toolchain/build_ffmpeg.sh) precisely because the
      # distribution build lacks scale_cuda's `format` option.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      # Same binary and same checksum as the images: a packager that changes
      # version changes the bytes every job produces.
      - name: Install Shaka Packager 3.2.0
        run: |
          curl -fsSL https://github.com/shaka-project/shaka-packager/releases/download/v3.2.0/packager-linux-x64 \
            -o /usr/local/bin/packager
          echo "05af2e9ef5f12d58b9d615b7d31dc0eb61c32aee632c71965340b43c1556043e  /usr/local/bin/packager" | sha256sum -c -
          chmod +x /usr/local/bin/packager
          packager --version
      - name: Run pytest
        working-directory: transcoding
        run: python -m pytest tests

  docker-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Both compose files are configuration, and a typo in either is invisible
      # until someone deploys: `config` resolves interpolation, service
      # references and env_file requirements without starting anything.
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.dev.yml config --quiet
          # The deployment stack requires a root .env (fail-fast by design).
          cp .env.example .env
          docker compose config --quiet
      - name: Build API image
        run: docker build -f server/Dockerfile -t clipmux-api .
      - name: Build web image
        run: docker build -f web/Dockerfile -t clipmux-web .
      # The agent image was never built here, so a broken Dockerfile.agent
      # stayed invisible until someone ran the transcoder profile.
      - name: Build transcoder agent image
        run: docker build -f transcoding/Dockerfile.agent -t clipmux-transcoder .

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      # @clipmux/uploader and @clipmux/player only build at tag time otherwise,
      # so a broken build stayed invisible until a release was cut.
      - name: Build published packages
        run: |
          pnpm --filter @clipmux/uploader build
          pnpm --filter @clipmux/player build

  soft-delete-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Soft deletion is only correct if every library read excludes deleted
      # rows, and forgetting at one call site is silent — it resurrects a video
      # the tenant believes they deleted. Tests cover behaviour; this covers the
      # call site nobody wrote a test for.
      - name: Every video read must exclude soft-deleted rows
        run: |
          fail=0
          while IFS= read -r line; do
            file="${line%%:*}"
            rest="${line#*:}"
            n="${rest%%:*}"
            # Either the chain composes `notDeleted`, or the read carries an
            # explicit, reviewable exemption.
            window="$(sed -n "$((n>10 ? n-10 : 1)),$((n+6))p" "$file")"
            if ! printf '%s' "$window" | grep -q 'notDeleted' \
               && ! printf '%s' "$window" | grep -q 'soft-delete-exempt'; then
              echo "::error file=$file,line=$n::read of \`video\` does not compose \`notDeleted\`"
              fail=1
            fi
          done < <(grep -rn '^[[:space:]]*\.from(video)' server/src --include='*.ts' || true)
          if [ "$fail" -ne 0 ]; then
            echo "Add \`notDeleted\` from server/src/db/predicates.ts, or mark the read"
            echo "with a \`// soft-delete-exempt: <reason>\` comment and extend this guard."
            exit 1
          fi
          echo "all video reads exclude soft-deleted rows"

  runtime-boundary-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The API runs on two runtimes, and the boundary between them used to be
      # implicit: a middleware copied `c.env` into `process.env` on every request
      # so that modules written against ambient env would work on Workers. That
      # bridge is gone. This guard keeps it gone, because the failure mode is
      # silent — code that reads the wrong environment looks fine until one
      # runtime misbehaves.
      - name: Only the composition roots may read the ambient environment
        run: |
          fail=0
          # Allow-list: the two entrypoints (which own process.env), the seed
          # CLI, and the Node migration runner. Comments are excluded, so
          # explaining the old behaviour in a doc comment is fine.
          hits="$(grep -rn 'process\.env' server/src --include='*.ts' \
            | grep -v '^server/src/node/' \
            | grep -v '^server/src/db/seed.ts' \
            | grep -vE ':[0-9]+:[[:space:]]*(\*|//)' || true)"
          if [ -n "$hits" ]; then
            echo "::error::process.env read outside a composition root:"
            printf '%s\n' "$hits"
            echo "Take it from RuntimeCapabilities (c.var.runtime.env or .config) instead."
            fail=1
          fi

          # `c.env` is the Workers binding map. Only the runtime layer may read
          # it; everything else goes through c.var.runtime.
          envs="$(grep -rn 'c\.env' server/src --include='*.ts' \
            | grep -v '^server/src/runtime/' \
            | grep -vE ':[0-9]+:[[:space:]]*(\*|//)' || true)"
          if [ -n "$envs" ]; then
            echo "::error::c.env read outside the runtime layer:"
            printf '%s\n' "$envs"
            echo "Add a capability in server/src/runtime/ instead of reading bindings."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "no ambient environment reads outside the composition roots"

  # The launcher runs before anything else on a new machine, in the shell macOS
  # actually ships, and it is the one place a mistake is unrecoverable for the
  # user (a half-installed toolchain). shellcheck catches the class of bug that
  # only shows up on someone else's distro; the real Bash 3.2 run catches the one
  # shellcheck cannot see — bashisms that macOS's /bin/bash (3.2) rejects.
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck the launcher
        run: |
          # Run from scripts/ so the `source=lib/detect.sh` directive resolves.
          docker run --rm -v "$PWD/scripts:/w:ro" -w /w \
            koalaman/shellcheck:stable -x bootstrap.sh lib/detect.sh
      - name: No bash-4-only syntax in the launcher
        run: |
          # Supplementary to the 3.2 run below: a fast, explicit list of the
          # constructs that silently break on macOS.
          if grep -nE 'declare[[:space:]]+-A|mapfile|readarray|local[[:space:]]+-n|\$\{[A-Za-z_][A-Za-z0-9_]*(,,|\^\^)' \
            scripts/bootstrap.sh scripts/lib/detect.sh; then
            echo "bash-4-only syntax found — macOS ships bash 3.2 as /bin/bash"
            exit 1
          fi
      - name: Run the detector under real Bash 3.2
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w bash:3.2 bash -c '
            set -e
            . scripts/lib/detect.sh
            ov_detect_all
            ov_dump
            CLIPMUX_NO_SUDO=1 bash -c ". scripts/lib/detect.sh; ov_detect_all; ov_run_pkg python3 && exit 1; exit 0"
          '

  branding-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The rename to ClipMux replaced every earlier brand spelling — the
      # previous product name in each of its casings (upper, title, camel and
      # lower, and the env-var prefix) and the one before that. This is the
      # completion assertion for that pass: case-insensitive, and deliberately
      # absolute — there are no alias modules and no legacy env fallbacks, so
      # nothing legitimate can match.
      #
      # Scanning `.` (rather than a hand-written path list, which had gaps —
      # `setup/` and `marketing/` went unchecked) means a new top-level directory
      # is covered by default. The exclude-dirs matter: `.git` holds the whole
      # pre-rename history, and the rest are generated or vendored.
      #
      # Both alternatives are written with a character class so that this file
      # does not match its own search string and fail the gate it defines.
      - name: Forbid residual brand strings in source
        run: |
          if grep -rIn -iE 'openv[o]d|indiemu[x]' \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next \
            --exclude-dir=dist --exclude-dir=out --exclude-dir=.turbo \
            --exclude-dir=coverage --exclude-dir=.venv --exclude-dir=__pycache__ \
            --exclude-dir=.wrangler --exclude-dir=.pnpm-store \
            --exclude-dir=test-results --exclude-dir=playwright-report \
            --exclude-dir=.parcel-cache --exclude-dir=.cache \
            --include='*.ts' --include='*.tsx' --include='*.py' \
            --include='*.md' --include='*.mdx' --include='*.jsonc' --include='*.css' \
            --include='*.json' --include='*.sh' --include='*.mjs' \
            --include='*.yml' --include='*.yaml' --include='*.toml' \
            --include='*.svg' --include='*.example' --include='Dockerfile*' \
            --include='.gitignore' --include='.dockerignore' \
            . ; then
            echo "Residual brand strings found (see above). Rename pass incomplete."
            exit 1
          fi
